<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class XII Tracker - Minimal & Fast</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { cyan: '#06b6d4', purple: '#8b5cf6', emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12 select-none">

    <!-- Compact Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-cyan-500/20">
                    <i class="fa-solid fa-check text-sm font-bold"></i>
                </div>
                <h1 class="text-base font-extrabold bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent tracking-tight">
                    CLASS XII TRACKER
                </h1>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="addNewSubjectPrompt()" class="p-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Add Subject</span>
                </button>
                <button onclick="resetData()" class="p-2 text-xs font-semibold text-rose-400 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition flex items-center gap-1.5" title="Reset Syllabus">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-6 py-4 space-y-4">

        <!-- MINIMAL DASHBOARD OVERVIEW -->
        <section class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-cyan-400 text-sm"></i>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Quick Stats</span>
                </div>
                <div id="stat-overall" class="text-lg font-black text-cyan-400">0%</div>
            </div>

            <!-- Stats Bar -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                <div id="progress-bar" class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- Compact Counter Grid -->
            <div class="grid grid-cols-4 gap-2 text-center text-xs">
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/60">
                    <span class="block text-[10px] text-slate-400 font-bold uppercase">Notes</span>
                    <span id="stat-notes" class="font-black text-emerald-400 mt-0.5 block">0</span>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/60">
                    <span class="block text-[10px] text-slate-400 font-bold uppercase">MCQs</span>
                    <span id="stat-mcqs" class="font-black text-amber-400 mt-0.5 block">0</span>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/60">
                    <span class="block text-[10px] text-slate-400 font-bold uppercase">Rev</span>
                    <span id="stat-rev" class="font-black text-indigo-400 mt-0.5 block">0</span>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/60">
                    <span class="block text-[10px] text-slate-400 font-bold uppercase">Total</span>
                    <span id="stat-total" class="font-black text-purple-400 mt-0.5 block">0</span>
                </div>
            </div>
        </section>

        <!-- SUBJECT TABS (MOBILE FRIENDLY) -->
        <div id="subject-tabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-semibold">
            <!-- Tabs injected dynamically -->
        </div>

        <!-- ACTIVE SYLLABUS LIST -->
        <section id="active-subject-container" class="space-y-2">
            <!-- Dynamic Active Subject Content -->
        </section>

    </main>

    <script>
        function createPhysicsChapter(chNum, name) {
            return [
                { title: `Ch ${chNum}: ${name}`, isHeader: true, n: false, m: false, f: false },
                { title: 'Short Questions', isSub: true, n: false, m: false, f: false },
                { title: 'Long Questions', isSub: true, n: false, m: false, f: false },
                { title: 'Derivations', isSub: true, n: false, m: false, f: false },
                { title: 'Numericals', isSub: true, n: false, m: false, f: false },
                { title: 'MCQs', isSub: true, n: false, m: false, f: false }
            ];
        }

        function createChemChapter(chNum) {
            return [
                { title: `Chapter ${chNum}`, isHeader: true, n: false, m: false, f: false },
                { title: 'Short Questions', isSub: true, n: false, m: false, f: false },
                { title: 'Long Questions', isSub: true, n: false, m: false, f: false },
                { title: 'MCQs', isSub: true, n: false, m: false, f: false }
            ];
        }

        function createMathUnit(unitName, exercises) {
            let list = [{ title: unitName, isHeader: true, n: false, m: false, f: false }];
            exercises.forEach(ex => {
                list.push({ title: ex, isSub: true, n: false, m: false, f: false });
            });
            list.push({ title: 'Short Examples', isSub: true, n: false, m: false, f: false });
            list.push({ title: 'MCQs', isSub: true, n: false, m: false, f: false });
            return list;
        }

        function createGenChapter(title) {
            return [
                { title: title, isHeader: true, n: false, m: false, f: false },
                { title: 'Short / Long Questions', isSub: true, n: false, m: false, f: false },
                { title: 'MCQs', isSub: true, n: false, m: false, f: false }
            ];
        }

        const defaultSyllabus = [
            { id: 'sub_physics', name: 'PHYSICS', items: [
                ...createPhysicsChapter(15, 'Electrostatics'),
                ...createPhysicsChapter(16, 'Current Electricity'),
                ...createPhysicsChapter(17, 'Electromagnetism'),
                ...createPhysicsChapter(18, 'Electromagnetic Induction'),
                ...createPhysicsChapter(19, 'Alternating Current'),
                ...createPhysicsChapter(20, 'Physics of Solids'),
                ...createPhysicsChapter(21, 'Nuclear Physics')
            ]},
            { id: 'sub_chemistry', name: 'CHEMISTRY', items: [
                ...createChemChapter(1), ...createChemChapter(2), ...createChemChapter(3),
                ...createChemChapter(4), ...createChemChapter(5), ...createChemChapter(6),
                ...createChemChapter(7), ...createChemChapter(8), ...createChemChapter(9),
                ...createChemChapter(10), ...createChemChapter(11), ...createChemChapter(12), ...createChemChapter(13)
            ]},
            { id: 'sub_maths', name: 'MATHS', items: [
                ...createMathUnit('Unit 1: Functions & Limits', ['Ex 1.1 - 1.5']),
                ...createMathUnit('Unit 2: Differentiation', ['Ex 2.1 - 2.4', 'Review Ex 2']),
                ...createMathUnit('Unit 3: Integration', ['Ex 3.1 - 3.6', 'Review Ex 3']),
                ...createMathUnit('Unit 4: Analytic Geometry', ['Ex 4.1 - 4.4', 'Review Ex 4']),
                ...createMathUnit('Unit 5: Linear Inequalities', ['Ex 5.1 - 5.2']),
                ...createMathUnit('Unit 6: Conic Sections', ['Ex 6.1 - 6.7']),
                ...createMathUnit('Unit 7: Vectors', ['Ex 7.1 - 7.8'])
            ]},
            { id: 'sub_english', name: 'ENGLISH', items: [
                ...createGenChapter('Prose: Devoted Friend'), ...createGenChapter('Prose: I Have a Dream'),
                ...createGenChapter('Prose: Stress & Anger'), ...createGenChapter('Poetry: If'),
                ...createGenChapter('Poetry: 7 Ages of Man'), ...createGenChapter('Novel: Great Expectations')
            ]},
            { id: 'sub_pakstudies', name: 'PAK STUDIES', items: [
                ...createGenChapter('Chapter 1'), ...createGenChapter('Chapter 2'), ...createGenChapter('Chapter 3'),
                ...createGenChapter('Chapter 4'), ...createGenChapter('Chapter 5'), ...createGenChapter('Chapter 6')
            ]},
            { id: 'sub_urdu', name: 'URDU', items: [
                ...createGenChapter('Nasr: Seerat-e-Muhammadi'), ...createGenChapter('Nasr: Qaht-er-Rijal'),
                ...createGenChapter('Nazm: Hamd & Naat'), ...createGenChapter('Ghazaliat: Ghalib & Mir')
            ]}
        ];

        let syllabus = JSON.parse(localStorage.getItem('class12_minimal_v1')) || defaultSyllabus;
        let activeSubIdx = 0;

        function saveAndRender() {
            localStorage.setItem('class12_minimal_v1', JSON.stringify(syllabus));
            renderUI();
        }

        function resetData() {
            if (confirm("Kya aap saara progress reset karke naya minimal syllabus reload karna chahte hain?")) {
                localStorage.removeItem('class12_minimal_v1');
                syllabus = defaultSyllabus;
                activeSubIdx = 0;
                saveAndRender();
            }
        }

        function toggleCheck(subIdx, itemIdx, type) {
            syllabus[subIdx].items[itemIdx][type] = !syllabus[subIdx].items[itemIdx][type];
            saveAndRender();
        }

        function editTitle(subIdx, itemIdx) {
            const cur = syllabus[subIdx].items[itemIdx].title;
            const updated = prompt("Edit Title:", cur);
            if (updated && updated.trim() !== "") {
                syllabus[subIdx].items[itemIdx].title = updated.trim();
                saveAndRender();
            }
        }

        function addItem(subIdx) {
            const title = prompt("Enter New Item / Chapter:");
            if (title && title.trim() !== "") {
                syllabus[subIdx].items.push({ title: title.trim(), isSub: true, n: false, m: false, f: false });
                saveAndRender();
            }
        }

        function deleteItem(subIdx, itemIdx) {
            if (confirm("Delete this item?")) {
                syllabus[subIdx].items.splice(itemIdx, 1);
                saveAndRender();
            }
        }

        function addNewSubjectPrompt() {
            const name = prompt("Enter New Subject Name:");
            if (name && name.trim() !== "") {
                syllabus.push({ id: 'sub_' + Date.now(), name: name.trim().toUpperCase(), items: [] });
                activeSubIdx = syllabus.length - 1;
                saveAndRender();
            }
        }

        function calculateMetrics() {
            let totalItems = 0, totalN = 0, totalM = 0, totalF = 0;
            syllabus.forEach(sub => {
                sub.items.forEach(it => {
                    totalItems++;
                    if (it.n) totalN++;
                    if (it.m) totalM++;
                    if (it.f) totalF++;
                });
            });
            const overallPct = (totalItems * 3) > 0 ? Math.round(((totalN + totalM + totalF) / (totalItems * 3)) * 100) : 0;
            return { totalItems, totalN, totalM, totalF, overallPct };
        }

        function renderUI() {
            // Render Stats
            const m = calculateMetrics();
            document.getElementById('stat-overall').innerText = `${m.overallPct}%`;
            document.getElementById('progress-bar').style.width = `${m.overallPct}%`;
            document.getElementById('stat-notes').innerText = `${m.totalN}`;
            document.getElementById('stat-mcqs').innerText = `${m.totalM}`;
            document.getElementById('stat-rev').innerText = `${m.totalF}`;
            document.getElementById('stat-total').innerText = `${m.totalItems}`;

            // Render Tabs
            const tabsContainer = document.getElementById('subject-tabs');
            tabsContainer.innerHTML = '';
            syllabus.forEach((sub, idx) => {
                const isActive = idx === activeSubIdx;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-xl transition whitespace-nowrap border ${
                    isActive 
                    ? 'bg-cyan-500/10 border-cyan-500/50 text-cyan-300 font-bold shadow-md shadow-cyan-500/10' 
                    : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                }`;
                btn.innerText = sub.name;
                btn.onclick = () => { activeSubIdx = idx; renderUI(); };
                tabsContainer.appendChild(btn);
            });

            // Render Active Subject Syllabus List
            const container = document.getElementById('active-subject-container');
            container.innerHTML = '';

            const activeSub = syllabus[activeSubIdx];
            if (!activeSub) return;

            // Header Control
            const topBar = document.createElement('div');
            topBar.className = 'flex items-center justify-between bg-slate-900/90 border border-slate-800 px-3 py-2 rounded-xl text-xs';
            topBar.innerHTML = `
                <span class="font-bold text-cyan-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-book-bookmark"></i> ${activeSub.name}
                </span>
                <button onclick="addItem(${activeSubIdx})" class="text-[11px] font-semibold text-cyan-400 bg-cyan-500/10 hover:bg-cyan-500/20 px-2.5 py-1 rounded-lg transition">
                    + Add Item
                </button>
            `;
            container.appendChild(topBar);

            // List
            activeSub.items.forEach((it, itemIdx) => {
                const row = document.createElement('div');
                
                if (it.isHeader) {
                    row.className = 'mt-3 mb-1 px-3 py-1.5 bg-slate-900/90 border-l-4 border-cyan-400 rounded-r-xl text-xs font-bold text-cyan-300 flex items-center justify-between';
                    row.innerHTML = `
                        <span onclick="editTitle(${activeSubIdx}, ${itemIdx})" class="cursor-pointer truncate">${it.title}</span>
                        <button onclick="deleteItem(${activeSubIdx}, ${itemIdx})" class="text-slate-600 hover:text-rose-400 text-xs ml-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                } else {
                    row.className = 'ml-3 bg-slate-900/50 hover:bg-slate-900 border border-slate-800/60 p-2 rounded-xl text-xs flex items-center justify-between transition';
                    row.innerHTML = `
                        <span onclick="editTitle(${activeSubIdx}, ${itemIdx})" class="text-slate-300 truncate flex-1 mr-2 cursor-pointer hover:text-cyan-400">
                            ${it.title}
                        </span>
                        
                        <div class="flex items-center gap-1.5">
                            <button onclick="toggleCheck(${activeSubIdx}, ${itemIdx}, 'n')" 
                                class="px-2 py-0.5 rounded-lg border text-[10px] font-black transition ${
                                    it.n ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-slate-950 text-slate-600 border-slate-800'
                                }">N</button>
                                
                            <button onclick="toggleCheck(${activeSubIdx}, ${itemIdx}, 'm')" 
                                class="px-2 py-0.5 rounded-lg border text-[10px] font-black transition ${
                                    it.m ? 'bg-amber-500/20 text-amber-400 border-amber-500/40' : 'bg-slate-950 text-slate-600 border-slate-800'
                                }">M</button>
                                
                            <button onclick="toggleCheck(${activeSubIdx}, ${itemIdx}, 'f')" 
                                class="px-2 py-0.5 rounded-lg border text-[10px] font-black transition ${
                                    it.f ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' : 'bg-slate-950 text-slate-600 border-slate-800'
                                }">F</button>

                            <button onclick="deleteItem(${activeSubIdx}, ${itemIdx})" class="text-slate-700 hover:text-rose-400 text-xs ml-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                }
                container.appendChild(row);
            });
        }

        renderUI();
    </script>
</body>
</html>
